# Lilliput : publication automatique des niveaux validés + réveil de la base Supabase.
# Tourne toutes les heures, et peut être lancé à la main depuis l'onglet « Actions ».
name: Lilliput - publier les niveaux
on:
  schedule:
        - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: lilliput-publier-niveaux
defaults:
  run:
    working-directory: lilliput
jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publier les niveaux acceptés
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/publier-niveaux.mjs
      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "lilliput-bot"
          git config user.email "lilliput-bot@users.noreply.github.com"
          git add niveaux
          if git diff --cached --quiet; then echo "Rien de nouveau."; else git commit -m "Lilliput : nouveaux niveaux de la communauté" && git push; fi
