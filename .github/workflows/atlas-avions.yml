# Atlas du Ciel (damballah.github.io/atlas) : relevé mondial des avions toutes les 5 min -> branche « atlas-avions »
# Compte OpenSky conseillé : Settings > Secrets and variables > Actions > OPENSKY_CLIENT_ID et OPENSKY_CLIENT_SECRET
name: Atlas - avions

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-avions
  cancel-in-progress: true

jobs:
  avions:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: atlas/outils
      - name: Relevé OpenSky
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
        run: python3 atlas/outils/avions.py --out /tmp/avions --previous "https://raw.githubusercontent.com/${{ github.repository }}/atlas-avions/avions.json"
      - name: Publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f /tmp/avions/avions.json ]; then echo "Pas de nouveau relevé : le précédent reste en ligne."; exit 0; fi
          cd /tmp/avions
          git init -q -b atlas-avions
          git config user.name "atlas-du-ciel[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Avions $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:atlas-avions
