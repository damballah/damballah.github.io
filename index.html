<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Projets GitHub</title>
<meta name="description" content="Mes dépôts GitHub et leurs sites, mis à jour automatiquement.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>▸</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* ===== Jeux de couleurs ===== */
:root, :root[data-theme="clair"]{
  --bg:#f3f3f3; --surface:#ffffff; --line:#e0e0e0; --line2:#cbcbcb;
  --text:#222222; --muted:#585858; --faint:#8a8a8a;
  --accent:#2f6a98; --prompt:#3a7a3e; --soft:#e4edf4;
  color-scheme:light;
}
:root{ --font:"IBM Plex Mono", ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace }
@media (prefers-color-scheme: dark){
  :root:not([data-theme]){
    --bg:#1e1e1e; --surface:#262626; --line:#333333; --line2:#474747;
    --text:#e2e2e2; --muted:#a8a8a8; --faint:#7c7c7c;
    --accent:#82b4da; --prompt:#93c793; --soft:#2a3540; color-scheme:dark;
  }
}
:root[data-theme="sombre"]{
  --bg:#1e1e1e; --surface:#262626; --line:#333333; --line2:#474747;
  --text:#e2e2e2; --muted:#a8a8a8; --faint:#7c7c7c;
  --accent:#82b4da; --prompt:#93c793; --soft:#2a3540; color-scheme:dark;
}
:root[data-theme="solarized"]{
  --bg:#fdf6e3; --surface:#fffbf0; --line:#ece5d0; --line2:#ddd5bd;
  --text:#2f4249; --muted:#5f747b; --faint:#93a1a1;
  --accent:#268bd2; --prompt:#859900; --soft:#eee8d5; color-scheme:light;
}
:root[data-theme="nord"]{
  --bg:#2e3440; --surface:#353c4a; --line:#434c5e; --line2:#4c566a;
  --text:#eceff4; --muted:#c3cad6; --faint:#8e98aa;
  --accent:#88c0d0; --prompt:#a3be8c; --soft:#3b4757; color-scheme:dark;
}
:root[data-theme="gruvbox"]{
  --bg:#282828; --surface:#32302f; --line:#3c3836; --line2:#504945;
  --text:#ebdbb2; --muted:#bdae93; --faint:#928374;
  --accent:#83a598; --prompt:#b8bb26; --soft:#3c3836; color-scheme:dark;
}

*{box-sizing:border-box}
html{height:100%}
body{margin:0; min-height:100%; background:var(--bg); color:var(--text);
  font:14.5px/1.6 var(--font); -webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.wrap{max-width:1160px; margin:0 auto;
  padding:calc(48px + env(safe-area-inset-top,0px)) 24px calc(40px + env(safe-area-inset-bottom,0px))}

/* Lignes de commande discrètes */
.cmd{margin:0 0 8px; font-size:13px; color:var(--faint)}
.cmd .ps1{color:var(--prompt)}
.cmd.section{margin:36px 0 14px}

/* ===== En-tête ===== */
header{display:flex; flex-wrap:wrap; align-items:flex-start; justify-content:space-between; gap:24px 40px;
  padding-bottom:28px; border-bottom:1px solid var(--line)}
.identity{display:flex; align-items:flex-start; gap:22px; min-width:0}
.avatar{flex:none; width:96px; height:96px; border-radius:6px; object-fit:cover;
  background:var(--line); border:1px solid var(--line2)}
header h1{margin:0; font-size:clamp(24px,3.4vw,32px); line-height:1.2; font-weight:600; letter-spacing:-.01em}
.bio{margin:8px 0 0; color:var(--text); max-width:60ch}
.bio[hidden]{display:none}
.subtitle{margin:6px 0 0; color:var(--muted); font-size:13.5px}
.subtitle::before{content:"→ "; color:var(--faint)}

.head-side{display:flex; flex-direction:column; align-items:flex-end; gap:14px}
.profile-link{font-size:13px; color:var(--muted); text-decoration:none; border-bottom:1px solid var(--line2)}
.profile-link:hover{color:var(--accent); border-color:var(--accent)}
.themes{display:flex; flex-wrap:wrap; gap:6px; justify-content:flex-end}
.themes button{font:inherit; font-size:12px; display:flex; align-items:center; gap:6px; cursor:pointer;
  color:var(--muted); background:transparent; border:1px solid var(--line); border-radius:4px; padding:3px 8px}
.themes button:hover{border-color:var(--line2); color:var(--text)}
.themes button[aria-checked="true"]{border-color:var(--accent); color:var(--text); background:var(--surface)}
.sw{width:12px; height:12px; border-radius:2px; border:1px solid rgba(128,128,128,.45);
  background:linear-gradient(135deg, var(--sb) 50%, var(--sa) 50%)}

/* ===== Filtres ===== */
.toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:12px}
.search{flex:1 1 280px; position:relative}
.search span{position:absolute; left:11px; top:50%; translate:0 -50%; color:var(--prompt); pointer-events:none}
.search input{width:100%; font:inherit; color:var(--text); background:var(--surface);
  border:1px solid var(--line2); border-radius:4px; padding:8px 12px 8px 28px; caret-color:var(--accent)}
.search input::placeholder{color:var(--faint)}
.search input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--soft)}
.toolbar select{font:inherit; font-size:13.5px; color:var(--text); background:var(--surface); border:1px solid var(--line2); border-radius:4px; padding:8px; cursor:pointer}
.toolbar label.check{display:flex; align-items:center; gap:7px; font-size:13.5px; color:var(--muted); cursor:pointer}
.toolbar input[type=checkbox]{accent-color:var(--accent); width:15px; height:15px}

.langs{display:flex; flex-wrap:wrap; gap:2px 16px; margin-bottom:24px; font-size:13px}
.lang-tab{font:inherit; background:none; border:0; padding:5px 0; cursor:pointer; color:var(--muted);
  border-bottom:2px solid transparent; display:flex; align-items:center; gap:7px}
.lang-tab:hover{color:var(--text)}
.lang-tab.on{color:var(--text); border-bottom-color:var(--accent)}
.lang-tab i{width:8px; height:8px; border-radius:1px; background:var(--lc)}
.lang-tab small{color:var(--faint); font-size:inherit}

.notice{margin:0 0 20px; padding:10px 14px; border-radius:4px; font-size:13px; border:1px solid var(--line2); background:var(--surface); color:var(--muted)}
.notice.err{border-color:#c4504a; color:var(--text)}
.notice[hidden]{display:none}

/* ===== Cartes ===== */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:20px}
.card{display:flex; flex-direction:column; min-width:0; cursor:pointer;
  background:var(--surface); border:1px solid var(--line); border-radius:6px; overflow:hidden}
.card:hover, .card:focus-visible{border-color:var(--accent)}
.thumb{position:relative; aspect-ratio:16/9; overflow:hidden; background:var(--bg); border-bottom:1px solid var(--line)}
.thumb img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:top center; background:var(--bg)}
.ph{position:absolute; inset:0; display:grid; place-items:center; background:color-mix(in srgb, var(--lc) 10%, var(--surface))}
.ph b{font-size:34px; font-weight:600; color:color-mix(in srgb, var(--lc) 65%, var(--text))}
.skel{position:absolute; inset:0; background:linear-gradient(100deg, transparent 30%, var(--line) 50%, transparent 70%) var(--bg);
  background-size:250% 100%; animation:sh 1.5s linear infinite}
@keyframes sh{from{background-position:120% 0}to{background-position:-120% 0}}

.cbody{padding:14px 16px 16px; display:flex; flex-direction:column; gap:8px; flex:1}
.card h2{margin:0; font-size:15.5px; font-weight:600; color:var(--accent); word-break:break-word; display:flex; align-items:baseline; gap:10px}
.card h2 .slash{color:var(--faint); font-weight:400}
.badge{font-size:11px; font-weight:400; color:var(--muted); border:1px solid var(--line2); border-radius:3px; padding:0 6px; white-space:nowrap}
.desc{margin:0; color:var(--muted); font-size:13.5px; line-height:1.6; flex:1}
.desc .none{color:var(--faint); font-style:italic}
.meta{display:flex; flex-wrap:wrap; gap:2px 16px; font-size:12px; color:var(--faint)}
.meta .lang{display:flex; align-items:center; gap:6px; color:var(--muted)}
.meta .lang i{width:8px; height:8px; border-radius:1px; background:var(--lc)}
.actions{display:flex; flex-wrap:wrap; gap:4px 16px; margin-top:4px; font-size:13px}
.actions a{text-decoration:none; color:var(--text)}
.actions a:hover{color:var(--accent)}
.actions a.site{color:var(--prompt)}
.actions a.site:hover{text-decoration:underline; text-underline-offset:3px}
.actions .off{color:var(--faint)}

.empty{grid-column:1/-1; padding:40px 24px; text-align:center; color:var(--muted); border:1px dashed var(--line2); border-radius:6px}

footer{margin-top:56px; padding-top:18px; border-top:1px solid var(--line); display:flex; flex-wrap:wrap; gap:6px 20px;
  font-size:12.5px; color:var(--faint)}
footer button{font:inherit; color:var(--muted); background:none; border:0; padding:0; cursor:pointer}
footer button:hover{color:var(--accent)}
footer .sep{flex:1}

@media (max-width:640px){
  .wrap{padding-left:16px; padding-right:16px}
  .head-side{align-items:flex-start}
  .themes{justify-content:flex-start}
  .identity{gap:16px}
  .avatar{width:64px; height:64px}
}
@media (prefers-reduced-motion: reduce){ .skel{animation:none} }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="identity">
      <img class="avatar" id="avatar" alt="" width="96" height="96">
      <div>
        <p class="cmd"><span class="ps1"><span class="u">user</span>@github</span>:~$ whoami</p>
        <h1 id="title">Projets</h1>
        <p class="bio" id="bio" hidden></p>
        <p class="subtitle" id="subtitle">chargement des dépôts…</p>
      </div>
    </div>
    <div class="head-side">
      <a class="profile-link" id="profile" href="#" target="_blank" rel="noopener">github.com/<span class="u">user</span></a>
      <div class="themes" id="themes" role="radiogroup" aria-label="Couleurs du thème"></div>
    </div>
  </header>

  <p class="cmd section"><span class="ps1"><span class="u">user</span>@github</span>:~$ ls projets/</p>

  <div class="toolbar">
    <label class="search">
      <span aria-hidden="true">&gt;</span>
      <input id="q" type="search" placeholder="rechercher un projet" autocomplete="off" spellcheck="false" aria-label="Rechercher un projet">
    </label>
    <select id="sort" aria-label="Trier les projets">
      <option value="pushed">plus récents</option>
      <option value="name">nom (a–z)</option>
      <option value="site">avec site d'abord</option>
      <option value="stars">plus d'étoiles</option>
    </select>
    <label class="check"><input type="checkbox" id="forks"> inclure les forks</label>
  </div>

  <nav class="langs" id="langs" aria-label="Filtrer par langage"></nav>
  <p class="notice" id="notice" hidden></p>
  <main class="grid" id="grid"></main>

  <footer>
    <span>liste mise à jour automatiquement depuis GitHub</span>
    <span id="st-sync"></span>
    <span class="sep"></span>
    <button id="resync" type="button">[ actualiser ]</button>
  </footer>
</div>

<script>
(() => {
'use strict';

/* ======================= CONFIGURATION ======================= */
const host = location.hostname.toLowerCase();
const CONFIG = {
  // Détecté automatiquement sur xxx.github.io, sinon valeur par défaut :
  user: host.endsWith('.github.io') ? host.replace('.github.io', '') : 'damballah',
  displayName: 'Damballah Oueddo',             // nom affiché en titre (vide = nom du compte)
  showForks: false,            // afficher les forks par défaut
  hideTopic: 'hide-showcase',  // ajoute ce topic à un dépôt pour le masquer
  cardOpens: 'repo',           // clic sur une carte : 'repo' ou 'site'
  useOpenGraph: true,          // vignette de secours générée par GitHub
  listTTL: 10 * 60 * 1000,     // durée du cache de la liste (10 min)
  concurrency: 4,
};
/* ============================================================= */

const API = 'https://api.github.com';
const PFX = 'ghidx:v1:';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  clear(p){ try { Object.keys(localStorage).filter(k => k.startsWith(p)).forEach(k => localStorage.removeItem(k)); } catch(e){} },
};

const LANG = {Python:'#3572A5',JavaScript:'#d4b52a',TypeScript:'#3178c6',HTML:'#e34c26',CSS:'#663399',Shell:'#5fa12a',
  Java:'#b07219',C:'#6b717a','C++':'#f34b7d','C#':'#178600',Go:'#00ADD8',Rust:'#c07a4a',PHP:'#4F5D95',Ruby:'#cc342d',
  Vue:'#41b883',Lua:'#5b6bd6',Kotlin:'#A97BFF',Swift:'#F05138',Dart:'#00B4AB','Jupyter Notebook':'#DA5B0B',
  SCSS:'#c6538c',Svelte:'#ff3e00',PowerShell:'#3d7bbf',GDScript:'#5596c4'};
const langColor = l => LANG[l] || '#8b929c';

const state = { repos: [], meta: new Map(), q: '', sort: 'pushed', forks: CONFIG.showForks, lang: null, treeBlocked: false, hydrating: false };

const display = CONFIG.displayName || CONFIG.user.charAt(0).toUpperCase() + CONFIG.user.slice(1);
$('#title').textContent = display;
document.querySelectorAll('.u').forEach(e => e.textContent = CONFIG.user);
$('#avatar').src = `https://github.com/${encodeURIComponent(CONFIG.user)}.png?size=208`;
$('#avatar').addEventListener('error', e => e.target.remove(), { once: true });
document.title = `${display} — projets`;
$('#profile').href = `https://github.com/${CONFIG.user}`;
$('#forks').checked = state.forks;

/* ---------- Utilitaires ---------- */
function ago(t){
  const s = (Date.now() - t) / 1000;
  if (s < 60) return "à l'instant";
  const u = [[31536000,'an'],[2592000,'mois'],[604800,'semaine'],[86400,'jour'],[3600,'heure'],[60,'minute']];
  for (const [d,l] of u) if (s >= d) { const n = Math.floor(s/d); return `il y a ${n} ${l}${n>1 && l!=='mois' ? 's' : ''}`; }
}
const trunc = (s,n) => s.length > n ? s.slice(0,n).replace(/\s+\S*$/,'') + '…' : s;
const raw = (r,p) => `https://raw.githubusercontent.com/${r.full_name}/${encodeURI(r.default_branch)}/${p.split('/').map(encodeURIComponent).join('/')}`;
const og = r => `https://opengraph.githubassets.com/1/${r.full_name}`;
const isSelf = r => r.name.toLowerCase() === `${CONFIG.user}.github.io`;
const isHidden = r => isSelf(r) || r.topics.includes(CONFIG.hideTopic);
function siteOf(r){
  const h = (r.homepage || '').trim();
  if (h) return /^https?:\/\//i.test(h) ? h : 'https://' + h;
  if (r.has_pages) return `https://${r.owner.toLowerCase()}.github.io/${r.name}/`;
  return null;
}

/* ---------- Message d'état (affiché seulement en cas de souci) ---------- */
function notice(msg, kind){
  const el = $('#notice');
  if (!msg) { el.hidden = true; return; }
  el.hidden = false; el.className = 'notice ' + (kind || ''); el.textContent = msg;
}

/* ---------- API GitHub ---------- */
async function gh(path){
  const r = await fetch(API + path, { headers: { Accept: 'application/vnd.github+json' } });
  if (r.status === 403 || r.status === 429) { const e = new Error('quota'); e.rate = true; e.reset = +r.headers.get('x-ratelimit-reset'); throw e; }
  if (!r.ok) { const e = new Error('HTTP ' + r.status); e.status = r.status; throw e; }
  return r.json();
}

async function loadRepos(force){
  const key = PFX + 'list:' + CONFIG.user;
  const cached = store.get(key);
  if (!force && cached && Date.now() - cached.t < CONFIG.listTTL) return cached;
  try {
    let all = [], page = 1;
    for (;;) {
      const b = await gh(`/users/${encodeURIComponent(CONFIG.user)}/repos?per_page=100&page=${page}&sort=pushed`);
      all = all.concat(b);
      if (b.length < 100) break;
      page++;
    }
    const repos = all.map(r => ({
      name: r.name, full_name: r.full_name, owner: r.owner.login, html_url: r.html_url,
      description: r.description, homepage: r.homepage, has_pages: r.has_pages, language: r.language,
      stars: r.stargazers_count, fork: r.fork, archived: r.archived,
      topics: r.topics || [], pushed_at: r.pushed_at, default_branch: r.default_branch, size: r.size,
    }));
    const data = { t: Date.now(), repos };
    store.set(key, data);
    return data;
  } catch (e) {
    const why = e.rate
      ? `GitHub limite le nombre de consultations par heure. Réessayez après ${new Date(e.reset*1000).toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'})}.`
      : `Impossible de joindre GitHub pour le compte « ${CONFIG.user} ». Vérifiez votre connexion puis cliquez sur Actualiser.`;
    if (cached) { notice(why + ' La liste affichée est celle de la dernière consultation.'); return cached; }
    notice(why, 'err');
    return { t: Date.now(), repos: [] };
  }
}

/* ---------- Profil : photo, nom, bio (cache 1 h) ---------- */
async function loadProfile(force){
  const key = PFX + 'profile:' + CONFIG.user;
  const cached = store.get(key);
  if (!force && cached && Date.now() - cached.t < 60 * 60 * 1000) return cached;
  try {
    const u = await gh(`/users/${encodeURIComponent(CONFIG.user)}`);
    const p = { t: Date.now(), name: u.name, bio: u.bio, avatar: u.avatar_url };
    store.set(key, p);
    return p;
  } catch (e) { return cached; }
}

function renderProfile(p){
  if (!p) return;
  const name = CONFIG.displayName || p.name || display;
  $('#title').textContent = name;
  document.title = `${name} — projets`;
  const av = $('#avatar');
  if (av && p.avatar) { av.src = p.avatar + (p.avatar.includes('?') ? '&' : '?') + 's=208'; av.alt = `Photo de profil de ${name}`; }
  const bio = (p.bio || '').trim();
  $('#bio').hidden = !bio;
  $('#bio').textContent = bio;
}

/* ---------- README : extrait + première image ---------- */
async function fetchReadme(r){
  for (const n of ['README.md','readme.md','Readme.md','README.markdown','README']) {
    try { const res = await fetch(raw(r,n)); if (res.ok) return await res.text(); } catch(e){}
  }
  return null;
}

const BADGE = /shields\.io|badgen|badge|travis-ci|circleci|codecov|coveralls|\/workflows\/|buymeacoffee|ko-fi|paypal|forthebadge|visitor|hits\.|komarev|github-readme-stats|vercel\.app\/api/i;

function resolveImg(src, r){
  src = src.trim().replace(/&amp;/g,'&');
  if (!src || src.startsWith('data:') || src.startsWith('#')) return null;
  if (src.startsWith('//')) src = 'https:' + src;
  const m = src.match(/^https?:\/\/github\.com\/([^/]+\/[^/]+)\/(?:blob|raw)\/([^?#]+)/i);
  if (m) return `https://raw.githubusercontent.com/${m[1]}/${m[2]}`;
  if (/^https?:\/\//i.test(src)) return src;
  try { return new URL(src.replace(/^\.?\//,''), raw(r,'')).href; } catch(e){ return null; }
}

function firstImage(md, r){
  const found = [];
  const re1 = /!\[[^\]]*\]\(\s*<?([^)\s>]+)>?(?:\s+["'][^"']*["'])?\s*\)/g;
  const re2 = /<img\b[^>]*?\bsrc\s*=\s*["']([^"']+)["']/gi;
  let m;
  while ((m = re1.exec(md))) found.push([m.index, m[1]]);
  while ((m = re2.exec(md))) found.push([m.index, m[1]]);
  found.sort((a,b) => a[0] - b[0]);
  for (const [, src] of found) {
    if (BADGE.test(src)) continue;
    const u = resolveImg(src, r);
    if (u) return u;
  }
  return null;
}

function excerptOf(md){
  const t = md.replace(/\r/g,'')
    .replace(/```[\s\S]*?```/g,'\n\n')
    .replace(/<!--[\s\S]*?-->/g,'')
    .replace(/!\[[^\]]*\]\([^)]*\)/g,'')
    .replace(/<[^>]+>/g,' ')
    .replace(/\[([^\]]*)\]\([^)]*\)/g,'$1')
    .replace(/^\s*\[[^\]]+\]:\s*\S+.*$/gm,'');
  for (const b of t.split(/\n\s*\n/)) {
    const lines = b.split('\n').map(l => l.trim()).filter(Boolean);
    if (!lines.length) continue;
    if (/^#{1,6}\s/.test(lines[0])) lines.shift();
    if (lines.length >= 2 && /^(=+|-+)$/.test(lines[1])) lines.splice(0,2);
    if (!lines.length || /^(\||-{3,}|\*{3,}|_{3,})/.test(lines[0])) continue;
    let s = lines.map(l => l.replace(/^>\s?/,'').replace(/^[-*+]\s+/,'• ').replace(/^\d+\.\s+/,'')).join(' ');
    s = s.replace(/[*_`~]+/g,'').replace(/\s+/g,' ').trim();
    if (s.replace(/[^\p{L}\p{N}]/gu,'').length < 15) continue;
    return s;
  }
  return '';
}

/* ---------- Recherche d'une image dans le dépôt ---------- */
const IMG = /\.(png|jpe?g|gif|webp|avif|svg)$/i;
const KEY = /(preview|screenshot|screen|capture|thumb|thumbnail|cover|banner|hero|demo|apercu|aperçu|vignette|social)/i;
const BAD = /(^|\/)(node_modules|vendor|\.git|bower_components)\/|favicon|apple-touch|android-chrome|mstile|sprite|emoji/i;

function pickTreeImage(tree, r){
  let best = null;
  for (const n of tree) {
    if (n.type !== 'blob' || !IMG.test(n.path) || BAD.test(n.path)) continue;
    const file = n.path.split('/').pop();
    const depth = n.path.split('/').length - 1;
    const key = KEY.test(file);
    let s = (key ? 100 : 0) - depth * 6;
    if (/\.svg$/i.test(file)) s -= 15;
    if (n.size > 20000) s += 12; else if (n.size < 4000) s -= 25;
    if (/(^|\/)(docs?|assets|images?|img|screenshots?|media|static|captures?)\//i.test(n.path)) s += 6;
    if (/logo|icon/i.test(file)) s -= 8;
    if (!best || s > best.s) best = { s, key, url: raw(r, n.path) };
  }
  return best;
}

async function getMeta(r){
  const m = { pushed: r.pushed_at, img: null, excerpt: '', complete: true };
  if (!r.size) { store.set(PFX + 'meta:' + r.full_name, m); return m; }

  const md = await fetchReadme(r);
  let readmeImg = null;
  if (md) { readmeImg = firstImage(md, r); m.excerpt = excerptOf(md); }

  let best = null;
  if (!state.treeBlocked) {
    try {
      const t = await gh(`/repos/${r.full_name}/git/trees/${encodeURIComponent(r.default_branch)}?recursive=1`);
      best = pickTreeImage(t.tree || [], r);
    } catch (e) {
      if (e.rate) { state.treeBlocked = true; m.complete = false; }
      else if (e.status !== 404 && e.status !== 409) m.complete = false;
    }
  } else m.complete = false;

  // Priorité : image nommée preview/screenshot… > 1re image du README > meilleure image du dépôt
  m.img = (best && best.key) ? best.url : (readmeImg || (best && best.url) || null);
  if (!m.complete && readmeImg) m.complete = true;
  store.set(PFX + 'meta:' + r.full_name, m);
  return m;
}

/* ---------- Rendu ---------- */
function baseList(){ return state.repos.filter(r => !isHidden(r) && (state.forks || !r.fork)); }
function visibleList(){
  let list = baseList();
  if (state.lang) list = list.filter(r => (r.language || 'Autre') === state.lang);
  if (state.q) {
    const q = state.q.toLowerCase();
    list = list.filter(r => [r.name, r.description, r.topics.join(' '), state.meta.get(r.full_name)?.excerpt]
      .join(' ').toLowerCase().includes(q));
  }
  const recent = (a,b) => Date.parse(b.pushed_at) - Date.parse(a.pushed_at);
  const by = {
    pushed: recent,
    stars:  (a,b) => b.stars - a.stars || recent(a,b),
    name:   (a,b) => a.name.localeCompare(b.name, 'fr', {sensitivity:'base'}),
    site:   (a,b) => (!!siteOf(b) - !!siteOf(a)) || recent(a,b),
  };
  return list.sort(by[state.sort]);
}

function thumbHTML(r, m){
  if (!m) return '<div class="skel"></div>';
  const initials = r.name.replace(/[^\p{L}\p{N}]+/gu,' ').trim().split(' ').slice(0,2).map(w => w[0]).join('').toUpperCase() || '?';
  const ph = `<div class="ph"><b>${esc(initials)}</b></div>`;
  const src = m.img || (CONFIG.useOpenGraph ? og(r) : '');
  if (!src) return ph;
  return ph + `<img loading="lazy" alt="Aperçu de ${esc(r.name)}" src="${esc(src)}" data-step="${m.img ? 0 : 1}">`;
}

function cardHTML(r){
  const m = state.meta.get(r.full_name);
  const site = siteOf(r);
  const desc = r.description || m?.excerpt || '';
  const descHTML = desc ? esc(trunc(desc, 170)) : m ? '<span class="none">pas de description</span>' : '';
  const badge = r.archived ? '<span class="badge">archivé</span>' : r.fork ? '<span class="badge">fork</span>' : '';
  return `<article class="card" data-id="${esc(r.full_name)}" tabindex="0" style="--lc:${langColor(r.language)}">
    <div class="thumb">${thumbHTML(r, m)}</div>
    <div class="cbody">
      <h2><span class="name">${esc(r.name)}<span class="slash">/</span></span>${badge}</h2>
      <p class="desc">${descHTML}</p>
      <div class="meta">
        ${r.language ? `<span class="lang"><i></i>${esc(r.language)}</span>` : ''}
        <span title="${esc(new Date(r.pushed_at).toLocaleString('fr-FR'))}">modifié ${ago(Date.parse(r.pushed_at))}</span>
        ${r.stars ? `<span>★ ${r.stars}</span>` : ''}
      </div>
      <div class="actions">
        <a href="${esc(r.html_url)}" target="_blank" rel="noopener">[ voir le code ]</a>
        ${site ? `<a class="site" href="${esc(site)}" target="_blank" rel="noopener">[ ouvrir le site ]</a>` : '<span class="off">[ pas de site ]</span>'}
      </div>
    </div>
  </article>`;
}

function renderHeader(){
  const list = baseList();
  if (!state.repos.length) return;
  const sites = list.filter(siteOf).length;
  $('#subtitle').textContent = `${list.length} projet${list.length > 1 ? 's' : ''} public${list.length > 1 ? 's' : ''}` +
    (sites ? `, dont ${sites} avec un site en ligne` : '');
}

function renderLangs(){
  const counts = {};
  baseList().forEach(r => { const l = r.language || 'Autre'; counts[l] = (counts[l]||0) + 1; });
  const entries = Object.entries(counts).sort((a,b) => b[1]-a[1]);
  if (state.lang && !counts[state.lang]) state.lang = null;
  if (entries.length < 2) { $('#langs').innerHTML = ''; return; }
  $('#langs').innerHTML =
    `<button class="lang-tab ${state.lang ? '' : 'on'}" data-lang="">tous <small>${baseList().length}</small></button>` +
    entries.map(([l,n]) => `<button class="lang-tab ${state.lang===l?'on':''}" data-lang="${esc(l)}" style="--lc:${langColor(l)}"><i></i>${esc(l)} <small>${n}</small></button>`).join('');
}

function render(){
  renderHeader();
  renderLangs();
  const list = visibleList();
  $('#grid').innerHTML = list.length ? list.map(cardHTML).join('')
    : state.repos.length
      ? `<div class="empty">Aucun projet ne correspond à cette recherche. Essayez un autre mot ou affichez tous les langages.</div>`
      : `<div class="empty">Aucun projet public à afficher pour le moment.</div>`;
}

function updateCard(r){
  const el = document.querySelector(`.card[data-id="${CSS.escape(r.full_name)}"]`);
  if (el) el.outerHTML = cardHTML(r);
}

/* ---------- Analyse des dépôts (README + images), avec cache ---------- */
async function hydrate(){
  if (state.hydrating) return;
  state.hydrating = true;
  const todo = baseList().filter(r => !state.meta.get(r.full_name)?.complete);
  let i = 0;
  const worker = async () => {
    while (i < todo.length) {
      const r = todo[i++];
      try { state.meta.set(r.full_name, await getMeta(r)); updateCard(r); } catch(e){}
    }
  };
  await Promise.all(Array.from({length: CONFIG.concurrency}, worker));
  state.hydrating = false;
}

async function main(force){
  notice('');
  const [data, prof] = await Promise.all([loadRepos(force), loadProfile(force)]);
  renderProfile(prof);
  state.repos = data.repos;
  for (const r of state.repos) {
    const m = store.get(PFX + 'meta:' + r.full_name);
    if (m && m.pushed === r.pushed_at) state.meta.set(r.full_name, m);
  }
  render();
  $('#st-sync').textContent = `Dernière synchronisation ${ago(data.t)}`;
  await hydrate();
}

/* ---------- Événements ---------- */
const grid = $('#grid');
grid.addEventListener('error', e => {
  const img = e.target;
  if (img.tagName !== 'IMG') return;
  const r = state.repos.find(x => x.full_name === img.closest('.card')?.dataset.id);
  if (img.dataset.step === '0' && CONFIG.useOpenGraph && r) { img.dataset.step = '1'; img.src = og(r); }
  else img.remove();
}, true);

function openCard(card){
  const r = state.repos.find(x => x.full_name === card.dataset.id);
  if (!r) return;
  const url = CONFIG.cardOpens === 'site' ? (siteOf(r) || r.html_url) : r.html_url;
  window.open(url, '_blank', 'noopener');
}
grid.addEventListener('click', e => {
  if (e.target.closest('a')) return;
  const card = e.target.closest('.card');
  if (card) openCard(card);
});
grid.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.classList.contains('card')) openCard(e.target);
});

$('#q').addEventListener('input', e => { state.q = e.target.value.trim(); render(); });
$('#sort').addEventListener('change', e => { state.sort = e.target.value; render(); });
$('#forks').addEventListener('change', e => { state.forks = e.target.checked; render(); hydrate(); });
$('#langs').addEventListener('click', e => {
  const b = e.target.closest('.lang-tab');
  if (!b) return;
  state.lang = b.dataset.lang || null;
  render();
});

/* ---------- Jeux de couleurs ---------- */
// sa = couleur d'accent, sb = fond (pour la pastille). Les couleurs complètes sont dans le CSS.
const THEMES = [
  { id: 'clair',     label: 'clair',     sa: '#2f6a98', sb: '#f3f3f3' },
  { id: 'sombre',    label: 'sombre',    sa: '#82b4da', sb: '#1e1e1e' },
  { id: 'solarized', label: 'solarized', sa: '#268bd2', sb: '#fdf6e3' },
  { id: 'nord',      label: 'nord',      sa: '#88c0d0', sb: '#2e3440' },
  { id: 'gruvbox',   label: 'gruvbox',   sa: '#b8bb26', sb: '#282828' },
];
const legacy = { light: 'clair', dark: 'sombre' };
let savedTheme = store.get(PFX + 'theme');
savedTheme = legacy[savedTheme] || savedTheme;
if (THEMES.some(t => t.id === savedTheme)) document.documentElement.dataset.theme = savedTheme;
const currentTheme = () => document.documentElement.dataset.theme
  || (matchMedia('(prefers-color-scheme: dark)').matches ? 'sombre' : 'clair');

function renderThemes(){
  const cur = currentTheme();
  $('#themes').innerHTML = THEMES.map(t =>
    `<button type="button" role="radio" aria-checked="${t.id === cur}" data-theme-id="${t.id}" title="Thème ${t.label}">` +
    `<span class="sw" style="--sa:${t.sa};--sb:${t.sb}"></span>${t.label}</button>`).join('');
}
$('#themes').addEventListener('click', e => {
  const b = e.target.closest('button[data-theme-id]');
  if (!b) return;
  document.documentElement.dataset.theme = b.dataset.themeId;
  store.set(PFX + 'theme', b.dataset.themeId);
  renderThemes();
});
renderThemes();

$('#resync').addEventListener('click', () => {
  const theme = store.get(PFX + 'theme');
  store.clear(PFX);
  if (theme) store.set(PFX + 'theme', theme);
  state.meta.clear(); state.treeBlocked = false;
  main(true);
});

main(false);
})();
</script>
</body>
