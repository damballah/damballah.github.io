<script>
'use strict';
/* =====================================================================
   ASCIIRINTHE — prototype
   Labyrinthe généré par le SHA-256 d'une chaîne alphanumérique (1 à 20)
   ===================================================================== */

// @core-start  ---------------------------------------------------------
const ALNUM = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';

// ---- SHA-256 (implémentation autonome, marche aussi en file://) ----
const SHA_K = (() => { const k = []; let n = 2; while (k.length < 64) { let p = true; for (let d = 2; d * d <= n; d++) if (n % d === 0) { p = false; break; } if (p) { const c = Math.cbrt(n); k.push(((c - Math.floor(c)) * 4294967296) >>> 0); } n++; } return k; })();
const SHA_H0 = (() => { const h = []; let n = 2; while (h.length < 8) { let p = true; for (let d = 2; d * d <= n; d++) if (n % d === 0) { p = false; break; } if (p) { const c = Math.sqrt(n); h.push(((c - Math.floor(c)) * 4294967296) >>> 0); } n++; } return h; })();
function ror(x, n) { return (x >>> n) | (x << (32 - n)); }
function sha256(str) {
  const bytes = new TextEncoder().encode(str);
  const l = bytes.length, total = ((l + 9 + 63) >> 6) << 6;
  const m = new Uint8Array(total); m.set(bytes); m[l] = 0x80;
  const dv = new DataView(m.buffer); dv.setUint32(total - 4, l * 8);
  let H = SHA_H0.slice(); const w = new Int32Array(64);
  for (let off = 0; off < total; off += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(off + i * 4) | 0;
    for (let i = 16; i < 64; i++) {
      const a = w[i - 15], b = w[i - 2];
      const s0 = ror(a, 7) ^ ror(a, 18) ^ (a >>> 3), s1 = ror(b, 17) ^ ror(b, 19) ^ (b >>> 10);
      w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
    }
    let [a, b, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const S1 = ror(e, 6) ^ ror(e, 11) ^ ror(e, 25), ch = (e & f) ^ (~e & g);
      const t1 = (h + S1 + ch + SHA_K[i] + w[i]) | 0;
      const S0 = ror(a, 2) ^ ror(a, 13) ^ ror(a, 22), maj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + maj) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    H = [H[0] + a, H[1] + b, H[2] + c, H[3] + d, H[4] + e, H[5] + f, H[6] + g, H[7] + h].map(x => x >>> 0);
  }
  return H;
}
function hexOf(H) { return H.map(x => x.toString(16).padStart(8, '0')).join(''); }

// ---- PRNG déterministe (sfc32) ----
function sfc32(a, b, c, d) {
  return function () {
    a >>>= 0; b >>>= 0; c >>>= 0; d >>>= 0;
    let t = (a + b) | 0; a = b ^ (b >>> 9); b = (c + (c << 3)) | 0;
    c = (c << 21) | (c >>> 11); d = (d + 1) | 0; t = (t + d) | 0; c = (c + t) | 0;
    return (t >>> 0) / 4294967296;
  };
}
function cleanSeed(s) { return String(s).toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 20); }
function starsOf(L) { return Math.max(1, Math.min(5, Math.ceil(L / 4))); } // 1-4 : 1★ · 5-8 : 2★ · 9-12 : 3★ · 13-16 : 4★ · 17-20 : 5★

const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const ITEM_W = [['soin', 27], ['temps', 22], ['onde', 16], ['arme', 12], ['vie', 9]]; // les 2 cartes sont placées à part

// ---- Génération du niveau à partir de la chaîne ----
function buildLevel(seedIn) {
  const seed = cleanSeed(seedIn);
  const H = sha256(seed), hex = hexOf(H);
  const L = seed.length, N = 7 + L, W = 2 * N + 1;
  const R = sfc32(H[0], H[1], H[2], H[3]); for (let i = 0; i < 12; i++) R();
  const R2 = sfc32(H[4] ^ 0x9e3779b9, H[5], H[6], H[7]); for (let i = 0; i < 12; i++) R2();
  const ri = (r, n) => Math.floor(r() * n);
  const g = new Uint8Array(W * W).fill(1);
  const T = (x, y) => y * W + x;

  // 1) backtracker récursif : couloirs longs + impasses
  const ey = ri(R, N);
  const vis = new Uint8Array(N * N); const st = [[0, ey]]; vis[ey * N] = 1; g[T(1, 2 * ey + 1)] = 0;
  while (st.length) {
    const [cx, cy] = st[st.length - 1]; const opts = [];
    for (const [dx, dy] of DIRS) { const nx = cx + dx, ny = cy + dy; if (nx >= 0 && ny >= 0 && nx < N && ny < N && !vis[ny * N + nx]) opts.push([nx, ny]); }
    if (!opts.length) { st.pop(); continue; }
    const [nx, ny] = opts[ri(R, opts.length)];
    vis[ny * N + nx] = 1; g[T(2 * nx + 1, 2 * ny + 1)] = 0; g[T(cx + nx + 1, cy + ny + 1)] = 0; st.push([nx, ny]);
  }
  // 2) "tressage" : on ouvre quelques murs => plusieurs chemins possibles
  const braid = (0.035 + ((H[7] >>> 24) / 255) * 0.05) * (1.25 - L / 32);
  for (let y = 1; y < W - 1; y++) for (let x = 1; x < W - 1; x++) {
    if (g[T(x, y)] !== 1) continue;
    const between = (x % 2 === 0 && y % 2 === 1) || (x % 2 === 1 && y % 2 === 0);
    if (between && R() < braid) g[T(x, y)] = 0;
  }
  // 3) sortie = case du bord est la plus éloignée de l'entrée
  const sx = 1, sy = 2 * ey + 1;
  const dist = bfs(g, W, sx, sy);
  let best = -1, exY = 1;
  for (let cy = 0; cy < N; cy++) { const d = dist[T(W - 2, 2 * cy + 1)]; if (d > best) { best = d; exY = 2 * cy + 1; } }
  g[T(0, sy)] = 2; g[T(W - 1, exY)] = 3;

  // 4) variantes de murs + caractères de la vue de dessus
  const vt = new Uint8Array(W * W), wch = new Array(W * W);
  for (let i = 0; i < W * W; i++) {
    const v = ri(R, 4); vt[i] = v;
    wch[i] = v === 0 ? seed[ri(R, L)] : v === 1 ? (R() < .5 ? '0' : '1') : v === 2 ? '#' : (R() < .5 ? '=' : '|');
  }
  // 5) ennemis et objets (placés par le 2e flux du hash)
  const cells = [];
  for (let cy = 0; cy < N; cy++) for (let cx = 0; cx < N; cx++) { const x = 2 * cx + 1, y = 2 * cy + 1; if (dist[T(x, y)] >= 8 && !(x === W - 2 && y === exY)) cells.push([x, y]); }
  for (let i = cells.length - 1; i > 0; i--) { const j = ri(R2, i + 1); [cells[i], cells[j]] = [cells[j], cells[i]]; }
  const nE = 3 + Math.floor(L * 0.9), nI = 4 + Math.floor(N / 3);
  const enemies = [], items = [];
  let k = 0;
  for (let i = 0; i < nE && k < cells.length; i++, k++) {
    const r = R2(); const type = L <= 3 ? 'glyph' : (L >= 8 && r < .2) ? 'brute' : (r < .55 ? 'spectre' : 'glyph'); // 1 à 3 car. : lettres seulement
    enemies.push({ x: cells[k][0] + .5, y: cells[k][1] + .5, type });
  }
  const tot = ITEM_W.reduce((s, x) => s + x[1], 0);
  for (let i = 0; i < nI && k < cells.length; i++, k++) {
    let r = R2() * tot, type = 'soin'; for (const [t, w] of ITEM_W) { if (r < w) { type = t; break; } r -= w; }
    items.push({ x: cells[k][0] + .5, y: cells[k][1] + .5, type });
  }
  // 6) deux cartes placées intelligemment :
  //    la 1re vers 30 % du trajet, la 2e vers 65 %, loin l'une de l'autre, de préférence au fond d'une impasse
  const used = new Set([...enemies, ...items].map(o => T(Math.floor(o.x), Math.floor(o.y))));
  const isDead = (x, y) => { let o = 0; for (const [dx, dy] of DIRS) if (g[T(x + dx, y + dy)] !== 1) o++; return o === 1; };
  const pickMap = (target, dRef, minFromRef) => {
    let bestC = null, bs = 1e9;
    for (let cy = 0; cy < N; cy++) for (let cx = 0; cx < N; cx++) {
      const x = 2 * cx + 1, y = 2 * cy + 1, i = T(x, y), dd = dist[i];
      if (dd < 6 || used.has(i) || (x === W - 2 && y === exY)) continue;
      if (dRef && dRef[i] < minFromRef) continue;
      const sc = Math.abs(dd - target) - (isDead(x, y) ? 5 : 0) + R2() * 3;
      if (sc < bs) { bs = sc; bestC = [x, y]; }
    }
    return bestC;
  };
  const m1 = pickMap(best * .3, null, 0);
  if (m1) {
    used.add(T(m1[0], m1[1])); items.push({ x: m1[0] + .5, y: m1[1] + .5, type: 'carte' });
    const d1 = bfs(g, W, m1[0], m1[1]);
    const m2 = pickMap(best * .65, d1, Math.max(8, Math.floor(best * .3))) || pickMap(best * .65, d1, 4);
    if (m2) items.push({ x: m2[0] + .5, y: m2[1] + .5, type: 'carte' });
  }
  // 7) indice : au 2e carrefour avant la sortie (en remontant le bon chemin), une lettre de couleur différente
  //    est posée sur un mur du BON couloir, juste après le carrefour. Si on rate l'indice, on peut se tromper de chemin.
  const path = [[W - 2, exY]];
  for (;;) {
    const [x, y] = path[path.length - 1], dd = dist[T(x, y)]; if (dd <= 0) break; let nxt = null;
    for (const [dx, dy] of DIRS) { const j = T(x + dx, y + dy); if (dist[j] === dd - 1) { nxt = [x + dx, y + dy]; break; } }
    if (!nxt) break; path.push(nxt);
  }
  const openN = (x, y) => { let o = 0; for (const [dx, dy] of DIRS) { const v = g[T(x + dx, y + dy)]; if (v === 0 || v === 3) o++; } return o; };
  const junctions = [];
  for (let k = 4; k < path.length - 2; k++) if (openN(path[k][0], path[k][1]) >= 3) junctions.push(k);
  const jk = junctions[1] != null && junctions[1] < path.length * .6 ? junctions[1] : junctions[0] != null ? junctions[0] : Math.min(8, path.length - 2);
  const prefLeft = (H[6] & 1) === 1; let hint = null;
  for (let m = jk - 1; m >= Math.max(1, jk - 3) && !hint; m--) {
    const [px, py] = path[m], [qx, qy] = path[m + 1], dx = px - qx, dy = py - qy; // sens de marche : du carrefour vers la sortie
    const left = [px + dy, py - dx], right = [px - dy, py + dx];
    for (const [sx2, sy2] of prefLeft ? [left, right] : [right, left]) {
      if (g[T(sx2, sy2)] === 1) { hint = { wall: T(sx2, sy2), face: T(px, py), letter: seed[(H[5] >>> 3) % L], junction: T(path[jk][0], path[jk][1]), stepsToExit: m + 1 }; break; }
    }
  }
  // 8) explosifs C4 : 1 ou 2 par niveau, sur un flux de hasard à part (le reste du niveau ne bouge pas)
  {
    const R5 = sfc32(H[1] ^ 0x85ebca6b, H[3], H[5] ^ 0xc2b2ae35, H[7]); for (let i = 0; i < 8; i++) R5();
    const taken = new Set([...enemies, ...items].map(o => T(Math.floor(o.x), Math.floor(o.y))));
    const cand = [];
    for (let cy = 0; cy < N; cy++) for (let cx = 0; cx < N; cx++) { const x = 2 * cx + 1, y = 2 * cy + 1, i = T(x, y); if (dist[i] >= 5 && !taken.has(i) && !(x === W - 2 && y === exY)) cand.push([x, y]); }
    const nC = 1 + (H[2] & 1);
    for (let i = 0; i < nC && cand.length; i++) { const j = Math.floor(R5() * cand.length), [x, y] = cand.splice(j, 1)[0]; items.push({ x: x + .5, y: y + .5, type: 'c4' }); }
  }
  return { seed, H, hex, L, N, W, g, vt, wch, ey, hint, start: { x: 1.5, y: sy + .5 }, exit: { x: W - 1, y: exY }, solution: best + 1 /* cases à traverser, du départ jusqu'à la case de sortie */, enemies, items, stars: starsOf(L) };
}
function bfs(g, W, sx, sy) {
  const d = new Int16Array(W * W).fill(-1), q = new Int32Array(W * W); let h = 0, t = 0;
  const s = sy * W + sx; d[s] = 0; q[t++] = s;
  while (h < t) {
    const i = q[h++], x = i % W, y = (i / W) | 0;
    for (const [dx, dy] of DIRS) {
      const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= W || ny >= W) continue;
      const j = ny * W + nx; const v = g[j];
      if (d[j] < 0 && (v === 0 || v === 3)) { d[j] = d[i] + 1; q[t++] = j; }
    }
  }
  return d;
}
// @core-end  -----------------------------------------------------------

/* =====================================================================
   CONSTANTES / ÉCRAN
   ===================================================================== */
const VW = 640, VH = 400, RW = 320, RH = 200, TIME_LIMIT = 600;
const GLYPHS = ALNUM + '#=+|-_.:*%@&<>/\\[]{}()$!?~^';
const GIDX = {}; for (let i = 0; i < GLYPHS.length; i++) GIDX[GLYPHS[i]] = i;
const THEMES = [
  { name: 'VERT TERMINAL', rgb: [60, 255, 110] },
  { name: 'AMBRE', rgb: [255, 170, 20] },
  { name: 'BLEU GLACIER', rgb: [120, 205, 255] },
  { name: 'ROSE', rgb: [255, 110, 200] },
  { name: 'JAUNE', rgb: [255, 235, 60] },
  { name: 'BLANC', rgb: [235, 235, 235] },
  { name: 'GRIS', rgb: [160, 166, 172] },
  { name: 'VIOLET', rgb: [185, 120, 255] }];
const FONT = '"Courier New",Courier,monospace';

const cv = document.getElementById('scr'), ctx = cv.getContext('2d');
cv.width = VW; cv.height = VH;
const rc = document.createElement('canvas'); rc.width = RW; rc.height = RH;
const rctx = rc.getContext('2d'); rctx.imageSmoothingEnabled = false;
const fImg = rctx.createImageData(RW, RH), fBuf = new Uint32Array(fImg.data.buffer);
const zbuf = new Float32Array(RW);

let TOUCH = false;
try { TOUCH = matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0 && matchMedia('(hover: none)').matches; } catch (e) { }

  const s = Math.min(innerWidth / VW, innerHeight / VH);

  const si = document.getElementById('seedIn'); if (si) si.style.fontSize = Math.round(26 * s) + 'px';
}

const Store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }

let theme = THEMES[settings.theme] ? settings.theme : 0;
// ======== LANGUES (français / anglais) ========
// Le jeu est écrit en français ; tr() traduit chaque texte affiché quand l'anglais est choisi.
const EN_DICT = {
  'NOUVELLE PARTIE': 'NEW GAME', 'SAISIR UNE CHAÎNE': 'ENTER A STRING', 'COMMANDES': 'CONTROLS',
  'LABYRINTHES NÉS D\'UNE CHAÎNE · SHA-256': 'MAZES BORN FROM A STRING · SHA-256',

  order.forEach((idx, k) => I.lock[idx] = .45 + k * .13);
  I.seedDone = .45 + L * .13 + .35;
  I.hexDone = I.seedDone + 64 * .012;
  I.mapStart = I.hexDone + .15;
  for (let i = 0; i < W * W; i++) I.res[i] = I.mapStart + .6 + Math.random() * (lv.g[i] === 0 ? 1.7 : 2.1);
  I.mapDone = I.mapStart + 2.95;
  I.end = I.mapDone + 1.5;

}

  const p = I.t; I.t += dt; const t = I.t, L = G.lv.L;
  for (let i = 0; i < L; i++) if (p < I.lock[i] && t >= I.lock[i]) Snd.lock();
  if (t > .3 && t < I.seedDone - .3 && Math.floor(t * 25) !== Math.floor(p * 25)) Snd.tick();
  if (t > I.seedDone && t < I.hexDone && Math.floor(t * 40) !== Math.floor(p * 40)) Snd.tick(.4);
  if (p < I.mapStart && t >= I.mapStart) Snd.scramble(2.9);

}

    if (ed || (ay > .6 && was <= .6)) onKey('ArrowDown', '');
    if (el) onKey('ArrowLeft', ''); if (er) onKey('ArrowRight', '');
    // valider : A (ou START) ; sur les manettes génériques le bouton du bas est souvent le n°2
    if (padEdge[0] || padEdge[9] || (pad.mapping !== 'standard' && padEdge[2] && S.state === 'menu')) onKey('Enter', '');
    if (padEdge[1]) onKey('Escape', '');
    const ax = pad.axes[0] || 0, wx = padPrev.ax || 0; padPrev.ax = ax;
    if (ax < -.6 && wx >= -.6) onKey('ArrowLeft', ''); if (ax > .6 && wx <= .6) onKey('ArrowRight', '');
    if (padEdge[3] && (S.state === 'win' || S.state === 'lose')) onKey('KeyR', 'r');
    if (padEdge[2] && (S.state === 'win' || S.state === 'lose' || S.state === 'library')) onKey('KeyP', 'p');
    padEdge.fill(false); // appui déjà traité : ne doit pas agir une 2e fois si l'écran vient de changer
  }
}
// croix directionnelle, quelle que soit la façon dont la manette la transmet :
// boutons 12-15 (manettes standard), « chapeau » sur l'axe 9 (manettes génériques sous Windows),
// ou axes 6/7 (manettes génériques sous Linux)
function padDpad() {
  const d = { u: padBtn(12), d: padBtn(13), l: padBtn(14), r: padBtn(15) };
  if (!pad || pad.mapping === 'standard') return d;
  const A = pad.axes, h = A[9];
  if (h !== undefined && Math.abs(h) <= 1.05) {
    const k = Math.round((h + 1) / (2 / 7)) % 8; // 0 haut, 1 haut-droite, 2 droite … 7 haut-gauche
    if (k === 7 || k <= 1) d.u = true; if (k >= 1 && k <= 3) d.r = true; if (k >= 3 && k <= 5) d.d = true; if (k >= 5 && k <= 7) d.l = true;
  }
  if (A.length >= 8) {
    const hx = A[6], hy = A[7], isHat = v => v === -1 || v === 0 || v === 1;
    if (isHat(hx) && isHat(hy)) { if (hy < -.5) d.u = true; if (hy > .5) d.d = true; if (hx < -.5) d.l = true; if (hx > .5) d.r = true; }
  }

}
// position de repos de chaque axe, mémorisée à la détection de la manette (et corrigée tant que l'axe ne bouge pas)
let padRest = null;
function padAxis(i) {
  const v = (pad && pad.axes[i]) || 0;
  if (!padRest || padRest.id !== (pad && pad.id)) padRest = { id: pad && pad.id, v: pad ? pad.axes.map(a => Math.abs(a) > .5 ? a : 0) : [] };
  const r = padRest.v[i] || 0;
  if (!r) return v;
  // axe « décalé » au repos (ex. gâchette à -1) : on mesure l'écart à ce repos, ramené entre -1 et 1
  return Math.abs(v - r) < .2 ? 0 : clamp((v - r) / 2, -1, 1);
}
function padMsg(t) { S.padMsg = t; S.padMsgT = 3; }
addEventListener('gamepadconnected', () => { if (!S.padMsgT || S.padMsgT <= 0) padMsg('MANETTE BRANCHÉE : APPUIE SUR UN BOUTON'); });
function padBtn(i) { const b = pad && pad.buttons[i]; return !!b && (b.pressed || b.value > .5); }

addEventListener('keydown', e => {
  Snd.init();
  if (S.shareOpen && !['Escape', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.code)) return;
  if (e.code === 'Tab' || e.code === 'Space' || e.code.startsWith('Arrow') || e.code === 'Backspace') e.preventDefault();
  keys[e.code] = true;
  if (e.ctrlKey || e.metaKey) return;
  if (e.repeat && !['ArrowUp', 'ArrowDown', 'Backspace'].includes(e.code)) return;
  onKey(e.code === 'NumpadEnter' ? 'Enter' : e.code, e.key); // Entrée du pavé numérique = Entrée principale, partout
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('paste', e => {
  if (S.state !== 'input' || e.target && e.target.id === 'seedIn') return;
  const t = (e.clipboardData || window.clipboardData).getData('text');
  S.input = cleanSeed(S.input + t); e.preventDefault();
});
addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouseL = false; if (S.state === 'play' && G.started) pause(); });

function onKey(code, key) {
  const k = (key || '').toLowerCase();
  if (S.shareOpen) {
    if (code === 'Escape') { closeShare(); return; }
    // manette / flèches : choisir un bouton de la fenêtre de partage, A / Entrée pour l'activer
    const bs = [...SH.el.querySelectorAll('button')].filter(b => b.offsetParent !== null);
    let i = bs.indexOf(document.activeElement);
    if (code === 'ArrowLeft' || code === 'ArrowUp') { i = i < 0 ? 0 : Math.max(0, i - 1); bs[i] && bs[i].focus(); Snd.move(); }
    else if (code === 'ArrowRight' || code === 'ArrowDown') { i = i < 0 ? 0 : Math.min(bs.length - 1, i + 1); bs[i] && bs[i].focus(); Snd.move(); }
    else if ((code === 'Enter' || code === 'Space') && i >= 0) bs[i].click();
    return;
  }
  switch (S.state) {
    case 'menu':
      if (code === 'ArrowUp') { S.sel = (S.sel + MENU.length - 1) % MENU.length; Snd.move(); }
      else if (code === 'ArrowDown') { S.sel = (S.sel + 1) % MENU.length; Snd.move(); }
      else if (code === 'Enter' || code === 'Space') { Snd.ok(); MENU[S.sel].act(); }
      else if (code === 'ArrowLeft' || code === 'ArrowRight') menuAdj(code === 'ArrowLeft' ? -1 : 1);
      break;
    case 'input':
      if (code === 'Escape') go('menu');
      else if (code === 'Backspace') S.input = S.input.slice(0, -1);
      else if (code === 'Enter') { if (S.input.length >= 1) { Snd.ok(); playSeed(S.input); } else Snd.denied(); }
      else if (/^[a-z0-9]$/i.test(key || '') && S.input.length < 20) { S.input += key.toUpperCase(); Snd.tick(2); }
      break;
    case 'library': {
      const L = sortedLib();
      if (code === 'Escape') go('menu');
      else if (code === 'ArrowUp') { S.libSel = Math.max(0, S.libSel - 1); Snd.move(); }
      else if (code === 'ArrowDown') { S.libSel = Math.min(L.length - 1, S.libSel + 1); Snd.move(); }
      else if (code === 'ArrowLeft') moveFocus(-1);
      else if (code === 'ArrowRight') moveFocus(1);
      else if (code === 'Enter' && L[S.libSel]) { if (!pressFocus()) { Snd.ok(); playSeed(L[S.libSel].seed); } }
      else if (code === 'Delete' && L[S.libSel]) {
        const s = L[S.libSel].seed; library = library.filter(x => x.seed !== s); Store.set('asciirinthe.lib', library);
        S.libSel = Math.max(0, Math.min(S.libSel, library.length - 1)); S.toast = 'CHAÎNE ' + s + ' EFFACÉE'; S.toastT = 2;
      }
      else if (k === 'p' && L[S.libSel]) openShare(libShareData(L[S.libSel]));
      else if (k === 'c' && L[S.libSel]) {
        const s = L[S.libSel].seed;
        try { navigator.clipboard.writeText(s).then(() => { S.toast = s + ' COPIÉE'; S.toastT = 2; }, () => { S.toast = 'COPIE IMPOSSIBLE'; S.toastT = 2; }); } catch (e) { }
      }
      if (S.libSel < S.libScroll) S.libScroll = S.libSel;
      if (S.libSel >= S.libScroll + LIB_ROWS) S.libScroll = S.libSel - LIB_ROWS + 1;
      break;
    }
    case 'help': if (code === 'Escape') go('menu'); break;
    case 'intro': if (code === 'Space' || code === 'Enter' || code === 'Escape') startZoom(); break;
    case 'play':
      if (code === 'Escape' || code === 'KeyP') pause();
      else if (code === 'KeyE' || code === 'KeyF') { if (G.started) doWave(); }
      else if (code === 'KeyC' || code === 'KeyG') placeC4();
      break;
    case 'pause':
      if (code === 'Escape' && performance.now() - S.pausedAt < 350) break;
      if (code === 'ArrowLeft' || code === 'ArrowUp') moveFocus(-1);
      else if (code === 'ArrowRight' || code === 'ArrowDown') moveFocus(1);
      else if (code === 'Enter' || code === 'Space') { if (!pressFocus()) resume(); }
      else if (code === 'KeyP') resume();
      else if (code === 'Escape') toMenu();
      break;
    case 'win': case 'lose':
      if (S.t < .6) break;
      if (code === 'ArrowLeft' || code === 'ArrowUp') moveFocus(-1);
      else if (code === 'ArrowRight' || code === 'ArrowDown') moveFocus(1);
      else if (code === 'Enter' || code === 'Space') { if (!pressFocus()) endContinue(S.state === 'win'); }
      else if (k === 'r') replayLevel();
      else if (k === 'v') { S.hideRes = !S.hideRes; S.replay = 0; S.bf = null; }
      else if (k === 'p') openShare();
      else if (code === 'Escape') toMenu();
      break;
  }
}
function endContinue(isWin) {
  if (isWin && RUN.mode === 'campaign') {
    if (RUN.level >= CAMPAIGN_LEVELS) { toMenu(); return; }
    RUN.level++; RUN.lives = G.lives; launch(randomSeed(campaignLen(RUN.level)));
  }
  else if (RUN.mode === 'campaign') continueCampaign();   // crédit utilisé (même niveau) ou point de reprise
  else { RUN.lives = 3; launch(G.lv.seed); }
}
// rejouer le niveau : en campagne, sans recharger les vies (après un échec : comme « continuer »)
function replayLevel() {
  if (RUN.mode !== 'campaign') { RUN.lives = 3; launch(G.lv.seed); return; }
  if (S.state === 'lose') { continueCampaign(); return; }
  RUN.lives = G.lives; launch(G.lv.seed);
}
function toCanvas(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * VW / r.width, y: (e.clientY - r.top) * VH / r.height }; }
cv.addEventListener('contextmenu', e => e.preventDefault());
// un « tap » (souris ou doigt) sur l'écran, hors jeu
function handleTap(p) {
  if (hitBtn(p)) return;
  switch (S.state) {
    case 'menu': {
      const i = Math.floor((p.y - MENU_Y + 6) / MENU_H);
      if (MENU[i] && MENU[i].adj) { S.sel = i; menuAdj(arrowClickDir(i, p.x)); break; }
      if (i >= 0 && i < MENU.length) { S.sel = i; Snd.ok(); MENU[i].act(); }
      break;
    }
    case 'input': if (TOUCH && p.y > 100 && p.y < 170) showSeedInput(true); break;
    case 'library': {
      const r = Math.floor((p.y - LIB_Y + 2) / LIB_H), idx = S.libScroll + r, L = sortedLib();
      if (r >= 0 && r < LIB_ROWS && L[idx] && p.x > 602 - 18 && p.x < 602 + 18) { S.libSel = idx; Snd.ok(); openShare(libShareData(L[idx])); break; }
      if (r >= 0 && r < LIB_ROWS && L[idx]) { if (idx === S.libSel) { Snd.ok(); goFull(); playSeed(L[idx].seed); } else { S.libSel = idx; S.delArm = 0; Snd.move(); } }
      break;
    }
    case 'intro': startZoom(); break;
    case 'pause': if (!TOUCH) resume(); break;
  }
}
cv.addEventListener('pointerdown', e => {
  Snd.init();
  if (e.pointerType === 'touch' || e.pointerType === 'pen') { if (!TOUCH) { TOUCH = true; syncTouchClass(); showSeedInput(S.state === 'input'); } }
  else if (TOUCH) { TOUCH = false; syncTouchClass(); showSeedInput(false); }
  const p = toCanvas(e);
  if (TOUCH) {
    e.preventDefault();
    try { cv.setPointerCapture(e.pointerId); } catch (er) { }
    if (S.state === 'play') { touchPlayDown(e, p); return; }
    TC.start[e.pointerId] = { x: p.x, y: p.y, moved: false, sy: p.y, scroll: S.libScroll };
    return;
  }
  cv.focus();
  if (S.state === 'play') {
    if (document.pointerLockElement !== cv && !lockFailed) { lockPointer(); G.started = true; return; }
    G.started = true;
    if (e.button === 0) mouseL = true;
    if (e.button === 2 && G.started) doWave();
    if (e.button === 1 && G.started) { e.preventDefault(); placeC4(); }
    return;
  }
  if (e.button === 0) handleTap(p);
});
cv.addEventListener('pointermove', e => {
  if (!TOUCH || e.pointerType === 'mouse') return;
  const p = toCanvas(e); touchMove(e, p);
  const st = TC.start[e.pointerId];
  if (st && Math.hypot(p.x - st.x, p.y - st.y) > 12) st.moved = true;
  if (st && S.state === 'library') { // glisser pour faire défiler les scores
    const n = sortedLib().length, rows = Math.round((st.sy - p.y) / LIB_H);
    S.libScroll = clamp(st.scroll + rows, 0, Math.max(0, n - LIB_ROWS));
    S.libSel = clamp(S.libSel, S.libScroll, Math.min(n - 1, S.libScroll + LIB_ROWS - 1));
  }
});
const touchEnd = e => {
  if (!TOUCH || e.pointerType === 'mouse') return;
  touchUp(e);
  const st = TC.start[e.pointerId]; delete TC.start[e.pointerId];
  if (st && !st.moved && e.type === 'pointerup' && S.state !== 'play') handleTap(toCanvas(e));
};
cv.addEventListener('pointerup', touchEnd);
cv.addEventListener('pointercancel', touchEnd);
addEventListener('touchend', () => Snd.init(), { passive: true });
document.addEventListener('visibilitychange', () => { if (document.hidden && S.state === 'play' && G.started) pause(); });
// champ de saisie natif
{
  const si = document.getElementById('seedIn');
  si.addEventListener('input', () => { const v = cleanSeed(si.value); S.input = v; if (si.value !== v) si.value = v; Snd.tick(2); });
  si.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') { e.preventDefault(); si.blur(); submitSeed(); } else if (e.key === 'Escape') go('menu'); });
}
addEventListener('mouseup', e => { if (e.button === 0) mouseL = false; });
cv.addEventListener('mousemove', e => {
  if (document.pointerLockElement === cv || (lockFailed && S.state === 'play')) {
    if (S.state === 'play') {
      S.mouseT = performance.now();
      const mx = clamp(e.movementX, -250, 250), my = clamp(e.movementY, -250, 250); // ignore les sauts parasites
      G.p.a += mx * .0026 * settings.sens; G.p.pitch = clamp((G.p.pitch || 0) - my * .3 * settings.sens, -85, 85);
      if (document.pointerLockElement !== cv) S.mx = toCanvas(e).x;
    }
    return;
  }
  const p = toCanvas(e); S.mx = p.x; S.mouseT = performance.now();
  for (let i = 0; i < BTNS.length; i++) { const b = BTNS[i]; if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) { S.bf = i; break; } }
  if (S.state === 'menu') { const i = Math.floor((p.y - MENU_Y + 6) / MENU_H); if (i >= 0 && i < MENU.length && i !== S.sel) S.sel = i; }
});
cv.addEventListener('mouseleave', () => { S.mx = null; });
cv.addEventListener('wheel', e => {
  if (S.state !== 'library') return;
  const n = sortedLib().length; S.libSel = clamp(S.libSel + Math.sign(e.deltaY), 0, Math.max(0, n - 1));
  if (S.libSel < S.libScroll) S.libScroll = S.libSel; if (S.libSel >= S.libScroll + LIB_ROWS) S.libScroll = S.libSel - LIB_ROWS + 1;
}, { passive: true });
document.addEventListener('pointerlockchange', () => {
  if (document.pointerLockElement !== cv) { mouseL = false; if (S.state === 'play' && G.started) pause(); }
});

/* =====================================================================
   BOUCLE PRINCIPALE
   ===================================================================== */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  S.t += dt; S.toastT -= dt;
  pollPad();
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, VW, VH);
  BTNS = [];
  if (S.state === 'play' && G && G.started && portrait()) pause();
  try {
    switch (S.state) {
      case 'menu': drawMenu(dt); break;
      case 'input': drawInput(); break;
      case 'library': drawLibrary(); break;
      case 'help': drawHelp(); break;
      case 'intro': updateIntro(dt); if (S.state === 'intro') drawIntro(); else drawZoom(); break;
      case 'zoom':
        Z.t += dt; drawZoom();
        if (Z.t >= Z.dur) { go('play'); Snd.startMusic(); }
        break;
      case 'play':
        updatePlay(dt);
        if (S.state === 'play') { drawPlayView(true); drawWeapon(); drawFX(); drawHUD(); }
        else if (S.state === 'pause') drawPause(); else drawEnd(S.state === 'win');
        break;
      case 'pause': Snd.update(dt, G.elapsed / TIME_LIMIT, 0, true); drawPause(); break;
      case 'win': drawEnd(true); break;
      case 'lose': drawEnd(false); break;
    }
  } catch (err) { console.error(err); }
  if (S.padMsgT > 0) { S.padMsgT -= dt; ctx.globalAlpha = 1; ctx.font = `bold 11px ${FONT}`; const w = ctx.measureText(S.padMsg).width;
    ctx.fillStyle = 'rgba(0,0,0,.8)'; ctx.fillRect(VW / 2 - w / 2 - 10, VH - 62, w + 20, 20); ctx.strokeStyle = col(.7); ctx.strokeRect(VW / 2 - w / 2 - 10, VH - 62, w + 20, 20);
    txt(S.padMsg, VW / 2, VH - 57, 11, Math.min(1, S.padMsgT), 'center', false); }
  requestAnimationFrame(frame);
}
buildThemeAssets();
applyLangDOM();
requestAnimationFrame(frame);
