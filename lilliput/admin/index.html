<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Lilliput — modération</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--tape:#F2C230;--graphite:#23272E;--graphite-2:#2E333C;--steel:#8A94A3;--paper:#F7F8FA;--volt:#FF2D2D;--ok:#2FD27A;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none !important}
body{background:var(--graphite);color:var(--paper);font-family:Rubik,system-ui,sans-serif;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:1.4rem 5vw 3rem}
header{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1.4rem}
h1{font-family:'Big Shoulders Display',Impact,sans-serif;font-weight:900;font-size:2.4rem;flex:1}
h1 small{font-size:1.1rem;color:var(--steel);font-weight:800;margin-left:.4rem}
.btn{display:inline-flex;align-items:center;gap:.4em;padding:.6em 1em;border-radius:6px;font-weight:700;background:var(--graphite-2);border:2px solid #444b57}
.btn.primary{background:var(--tape);color:var(--graphite);border-color:#C99A12}
.btn.ok{background:var(--ok);color:var(--graphite);border-color:#1f9a58}
.btn.danger{border-color:#6b2a2a;color:#ff9a9a}
.btn[disabled]{opacity:.4;pointer-events:none}
.card{background:var(--graphite-2);border:1px solid #3b414c;border-radius:10px;padding:1.4rem}
.login{max-width:380px;margin:12vh auto 0}
.login h2{font-family:'Big Shoulders Display',sans-serif;font-size:2rem;margin-bottom:.8rem}
label{display:block;font-size:.88rem;color:#c4c9d1;margin-top:.8rem}
input{width:100%;margin-top:.3rem;background:var(--graphite);border:2px solid #444b57;border-radius:6px;padding:.6em .8em;color:var(--paper);font:inherit}
.msg{min-height:1.3em;margin-top:.8rem;font-size:.9rem;color:#ff9a9a}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}
.tabs button{padding:.5em 1em;border-radius:20px;border:2px solid #444b57;font-weight:500}
.tabs button.on{background:var(--paper);color:var(--graphite);border-color:var(--paper)}
.tabs .n{display:inline-block;min-width:1.4em;margin-left:.3em;padding:0 .35em;border-radius:9px;background:var(--volt);color:#fff;font-size:.78rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem}
.item{background:var(--graphite-2);border:1px solid #3b414c;border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.item img{width:100%;aspect-ratio:3/2;object-fit:cover;background:#111;display:block}
.item .meta{padding:.8rem;display:flex;flex-direction:column;gap:.25rem;flex:1}
.item h3{font-size:1.05rem}
.item p{font-size:.84rem;color:var(--steel)}
.item .row{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:auto;padding-top:.6rem}
.empty{color:var(--steel);line-height:1.6;max-width:56ch}
.help{color:#c4c9d1;font-size:.9rem;line-height:1.55;margin-bottom:1rem;max-width:70ch}
.cmt{display:flex;gap:1rem;align-items:flex-start;padding:.7rem 0;border-bottom:1px solid #3b414c}
.cmt div{flex:1;font-size:.92rem;line-height:1.45}
.cmt b{color:var(--tape)}
.cmt small{display:block;color:var(--steel);font-size:.78rem}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--paper);color:var(--graphite);font-weight:700;padding:.7em 1.1em;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
<script src="../config.js"></script>
</head>
<body>
<div class="wrap">
  <section class="card login" id="loginBox">
    <h2>Modération</h2>
    <p class="help">Connecte-toi avec ton compte administrateur Supabase.</p>
    <label>E-mail<input type="email" id="email" autocomplete="username"></label>
    <label>Mot de passe<input type="password" id="pw" autocomplete="current-password"></label>
    <div style="margin-top:1.1rem"><button class="btn primary" id="bLogin">Se connecter</button></div>
    <p class="msg" id="loginMsg" role="alert"></p>
  </section>

  <section id="panel" hidden>
    <header><h1>Lilliput <small>modération</small></h1><a class="btn" href="../">Voir le site</a><button class="btn" id="bLogout">Se déconnecter</button></header>
    <nav class="tabs" id="tabs">
      <button data-t="pending" class="on">En attente<span class="n" id="nPending" hidden></span></button>
      <button data-t="approved">Acceptés</button>
      <button data-t="published">Publiés</button>
      <button data-t="comments">Commentaires</button>
    </nav>
    <p class="help" id="tabHelp"></p>
    <div id="view"></div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script type="module">
const $ = (id) => document.getElementById(id), CFG = window.LILLIPUT_CONFIG || {};
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const date = (d) => new Date(d).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' });
let toastT = 0; const toast = (t) => { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2400); };
if (!CFG.supabaseUrl || !CFG.supabaseAnonKey) { $('loginMsg').textContent = 'Le fichier config.js n\'est pas encore rempli (voir le guide).'; $('bLogin').disabled = true; throw new Error('config'); }
const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm');
// connexion séparée de celle du jeu : se connecter ici ne change pas ton pseudo de joueur
const sb = createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth: { storageKey: 'lilliput-admin' } });

const HELP = {
  pending: 'Niveaux proposés par les joueurs. Teste-les dans le jeu, puis accepte ou refuse. Un niveau accepté est publié automatiquement dans l\'heure.',
  approved: 'Niveaux acceptés, en attente de la prochaine publication automatique (toutes les heures). Tu peux aussi la lancer tout de suite depuis l\'onglet « Actions » du dépôt GitHub.',
  published: 'Niveaux visibles dans la galerie. « Retirer » les enlève de la galerie et des classements à la prochaine publication.',
  comments: 'Les 60 derniers commentaires. Supprime ceux qui ne respectent pas les autres.',
};
let tab = 'pending';

async function enter() {
  const { data: ok } = await sb.rpc('is_admin');
  if (!ok) { await sb.auth.signOut(); $('loginMsg').textContent = 'Ce compte n\'est pas administrateur (voir le guide, étape 3).'; return; }
  $('loginBox').hidden = true; $('panel').hidden = false; render();
}
$('bLogin').onclick = async () => {
  $('loginMsg').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pw').value });
  if (error) { $('loginMsg').textContent = 'Connexion refusée : vérifie l\'e-mail et le mot de passe.'; return; }
  enter();
};
$('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('bLogin').click(); });
$('bLogout').onclick = async () => { await sb.auth.signOut(); location.reload(); };
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { tab = b.dataset.t; document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b)); render(); });
{ const { data: { session } } = await sb.auth.getSession(); if (session) enter(); }

async function render() {
  $('tabHelp').textContent = HELP[tab]; const v = $('view'); v.innerHTML = '<p class="empty">Chargement…</p>';
  const { count } = await sb.from('inbox').select('id', { count: 'exact', head: true }).eq('status', 'pending');
  $('nPending').hidden = !count; $('nPending').textContent = count || '';
  if (tab === 'pending' || tab === 'approved') {
    const { data, error } = await sb.from('inbox').select('id,name,author,kind,thumb,created_at').eq('status', tab).order('created_at');
    if (error) { v.innerHTML = `<p class="empty">Erreur : ${esc(error.message)}</p>`; return; }
    if (!data.length) { v.innerHTML = `<p class="empty">${tab === 'pending' ? 'Rien à modérer pour l\'instant.' : 'Aucun niveau en attente de publication.'}</p>`; return; }
    v.innerHTML = '<div class="grid"></div>'; const g = v.firstChild;
    for (const r of data) {
      const el = document.createElement('article'); el.className = 'item';
      el.innerHTML = `<img alt="" src="${r.thumb || ''}"><div class="meta"><h3>${esc(r.name)}</h3><p>par <b>${esc(r.author)}</b>, ${r.kind === 'drawing' ? 'dessin' : 'photo'}</p><p>${date(r.created_at)}</p>
        <div class="row">${tab === 'pending' ? '<button class="btn" data-a="test">Tester</button><button class="btn ok" data-a="ok">Accepter</button><button class="btn danger" data-a="no">Refuser</button>' : '<button class="btn" data-a="back">Remettre en attente</button>'}</div></div>`;
      el.querySelectorAll('button').forEach(b => b.onclick = () => act(b.dataset.a, r, b));
      g.appendChild(el);
    }
  } else if (tab === 'published') {
    const { data } = await sb.from('levels').select('id,name,author,hidden,published_at').order('published_at', { ascending: false });
    if (!data?.length) { v.innerHTML = '<p class="empty">Aucun niveau publié pour l\'instant.</p>'; return; }
    v.innerHTML = '<div class="grid"></div>'; const g = v.firstChild;
    for (const r of data) {
      const el = document.createElement('article'); el.className = 'item';
      el.innerHTML = `<img alt="" src="../niveaux/${encodeURIComponent(r.id)}.jpg"><div class="meta"><h3>${esc(r.name)}</h3><p>par <b>${esc(r.author)}</b>, publié le ${date(r.published_at)}</p>${r.hidden ? '<p style="color:#ff9a9a">Retiré</p>' : ''}
        <div class="row"><a class="btn" href="../jeu/?niveau=${encodeURIComponent(r.id)}" target="_blank" rel="noopener">Jouer</a><button class="btn ${r.hidden ? '' : 'danger'}">${r.hidden ? 'Rétablir' : 'Retirer'}</button></div></div>`;
      el.querySelector('button').onclick = async () => {
        if (!r.hidden && !confirm(`Retirer « ${r.name} » de la galerie ?`)) return;
        const { data: done, error } = await sb.from('levels').update({ hidden: !r.hidden }).eq('id', r.id).select('id');
        if (error || !done?.length) { toast(error ? 'Erreur : ' + error.message : 'Refusé par la base : droit de modification manquant (voir le guide)'); return; } toast(r.hidden ? 'Niveau rétabli' : 'Niveau retiré (effectif à la prochaine publication)'); render();
      };
      g.appendChild(el);
    }
  } else {
    const { data } = await sb.from('comments').select('id,body,created_at,level_id,profiles(pseudo)').order('created_at', { ascending: false }).limit(60);
    if (!data?.length) { v.innerHTML = '<p class="empty">Aucun commentaire pour l\'instant.</p>'; return; }
    v.innerHTML = ''; for (const c of data) {
      const el = document.createElement('div'); el.className = 'cmt';
      el.innerHTML = `<div><b>${esc(c.profiles?.pseudo)}</b> ${esc(c.body)}<small>${date(c.created_at)}, niveau ${esc(c.level_id)}</small></div><button class="btn danger">Supprimer</button>`;
      el.querySelector('button').onclick = async () => { const { data: done, error } = await sb.from('comments').delete().eq('id', c.id).select('id'); if (error || !done?.length) toast(error ? 'Erreur : ' + error.message : 'Refusé par la base'); else { toast('Commentaire supprimé'); el.remove(); } };
      v.appendChild(el);
    }
  }
}
async function act(a, r, btn) {
  btn.disabled = true;
  if (a === 'test') {   // charge le niveau et l'ouvre dans le jeu, sans le publier
    const { data, error } = await sb.from('inbox').select('data').eq('id', r.id).single();
    btn.disabled = false; if (error || !data?.data) { toast('Niveau illisible'); return; }
    try { localStorage.setItem('lilliput_test_level', data.data); } catch { toast('Niveau trop lourd pour être testé ici'); return; }
    window.open('../jeu/?test=1', '_blank'); return;
  }
  const patch = a === 'ok' ? { status: 'approved' } : a === 'back' ? { status: 'pending' } : { status: 'rejected', data: null, thumb: null };
  if (a === 'no' && !confirm(`Refuser « ${r.name} » ? Il sera définitivement effacé.`)) { btn.disabled = false; return; }
  const { data: done, error } = await sb.from('inbox').update(patch).eq('id', r.id).select('id');
  if (error || !done?.length) { toast(error ? 'Erreur : ' + error.message : 'Refusé par la base'); btn.disabled = false; return; }
  toast(a === 'ok' ? 'Accepté : publication dans l\'heure' : a === 'back' ? 'Remis en attente' : 'Refusé'); render();
}
</script>
</body>
</html>
